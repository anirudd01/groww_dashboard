# Streamlit settings for the public server. The stage script copies this to .streamlit/config.toml
# inside the bundle only; local runs keep Streamlit's defaults.

[server]
headless = true
runOnSave = false
fileWatcherType = "none"
enableXsrfProtection = true
maxUploadSize = 1

[client]
# Visitors see that something failed, never a traceback (tracebacks can show paths, URLs and
# request details).
showErrorDetails = "none"
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
